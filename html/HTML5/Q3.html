<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Audio Tag -->
    <audio controls>
        <source src="hariram.mp3" type="audio/mp3">
    </audio>
  
    <!-- Audio Muted -->
    <audio controls muted>
        <source src="hariram.mp3" type="audio/mp3">
    </audio>
  
    <!-- Video tag -->
    <video controls width="400px">
        <source src="video.mp4" type="video/mp4" width="400px">
    </video>
 
    <!-- Autoplay -->
    <video controls width="400px" autoplay>
        <source src="video.mp4" type="video/mp4" width="400px">
    </video>
   
    <!-- looped autoplay -->
    <video controls width="400px" autoplay loop>
        <source src="video.mp4" type="video/mp4" width="400px">
    </video>
</body>

</html>
